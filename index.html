  <script>
    let RAW_DATA = window.RAW_DATA || [];

    const currentDayNumber = new Date().getDay();
    const dayMap = {
      1: { day: 'Thứ 2', index: 0 },
      2: { day: 'Thứ 3', index: 1 },
      3: { day: 'Thứ 4', index: 2 },
      4: { day: 'Thứ 5', index: 3 },
      5: { day: 'Thứ 6', index: 4 }
    };
    const initialDayConfig = dayMap[currentDayNumber] || { day: 'Thứ 2', index: 0 };
    let selectedDay = initialDayConfig.day;
    let selectedDayIndex = initialDayConfig.index;
    let selectedSession = 'Sáng';
    let selectedSessionIndex = 0;
    let selectedLevel = 'THCS';
    let selectedLevelIndex = 0;
    let selectedSubject = 'Tất cả';
    let selectedPeriodFilterValue = 'all';
    let showCardTime = localStorage.getItem('TKB_SHOW_TIME') !== 'false';
    let isAllCollapsed = false;

    let collapsedPeriods = new Set();
    let collapsedGrades = new Set();

    let pinnedTeachers = JSON.parse(localStorage.getItem('TKB_PINNED') || '[]');
    let searchHistory = JSON.parse(localStorage.getItem('TKB_HISTORY') || '[]');

    const TIMELINE_CONFIG = [
      { id: '1', name: 'Tiết 1', time: '08:00 - 08:40', session: 'Sáng' },
      { id: '2', name: 'Tiết 2', time: '08:55 - 09:35', session: 'Sáng' },
      { id: '3', name: 'Tiết 3', time: '09:40 - 10:20', session: 'Sáng' },
      { id: '4', name: 'Tiết 4', time: '10:25 - 11:05', session: 'Sáng' },
      { id: '5S', name: 'Tiết 5S', time: '11:10 - 11:50', session: 'Sáng' },
      { id: '5C', name: 'Tiết 5C', time: '12:45 - 13:25', session: 'Chiều' },
      { id: '6', name: 'Tiết 6', time: '13:30 - 14:10', session: 'Chiều' },
      { id: '7', name: 'Tiết 7', time: '14:15 - 15:10', session: 'Chiều' },
      { id: '8', name: 'Tiết 8', time: '15:15 - 15:55', session: 'Chiều' }
    ];

    const GRADE_ORDER = ['Khối 6', 'Khối 7', 'Khối 8', 'Khối 9', 'Khối 10', 'Khối 11', 'Khối 12', 'Khác'];

    const SUBJECT_GROUPS = [
      { id: 'all', label: 'Tất cả', keywords: [] },
      { id: 'toan', label: 'Toán', keywords: ['toan', 'toan hoc', 'toan ta'] },
      { id: 'van', label: 'Ngữ văn', keywords: ['ngu van', 'van'] },
      { id: 'anh', label: 'Tiếng Anh', keywords: ['tieng anh', 'tann', 'public speaking', 'tieng trung'] },
      { id: 'khtn', label: 'KHTN / Lý-Hóa-Sinh', keywords: ['khtn', 'vat ly', 'ly', 'hoa hoc', 'hoa', 'sinh hoc', 'sinh'] },
      { id: 'khxh', label: 'Sử / Địa / KTPL', keywords: ['lich su', 'su', 'dia ly', 'dia', 'gdcd', 'gdktpl'] },
      { id: 'tin_stem', label: 'Tin / STEM / CN', keywords: ['tin hoc', 'stem', 'cong nghe'] },
      { id: 'nghe_thuat', label: 'Nghệ thuật & GDTC', keywords: ['my thuat', 'am nhac', 'gdtc'] },
      { id: 'kns_hdtn', label: 'HĐTN & Kỹ năng', keywords: ['hdtn', 'ky nang song', 'huong nghiep'] }
    ];

    let TEACHER_LIST = [];
    let CLASS_LIST = [];
    let SUBJECT_LIST = [];

    function initDataStructures() {
      TEACHER_LIST = Array.from(new Set(RAW_DATA.map(d => d.teacher))).filter(Boolean);
      CLASS_LIST = Array.from(new Set(RAW_DATA.map(d => d.class))).filter(Boolean);
      SUBJECT_LIST = Array.from(new Set(RAW_DATA.map(d => d.subject))).filter(Boolean);
    }

    function removeVietnameseTones(str) {
      return str
        .normalize('NFD')
        .replace(/[̀-ͯ]/g, '')
        .replace(/đ/g, 'd')
        .replace(/Đ/g, 'D')
        .toLowerCase()
        .trim();
    }

    function calculateMatchScore(query, target) {
      const qRaw = query.trim().toLowerCase();
      const tRaw = target.trim().toLowerCase();
      if (!qRaw || !tRaw) return 0;
      if (qRaw === tRaw) return 10000;

      let score = 0;
      const targetWords = tRaw.split(/\s+/);
      if (tRaw.startsWith(qRaw)) score += 2000;
      if (targetWords.includes(qRaw)) score += 1500;
      if (targetWords.some(w => w.startsWith(qRaw))) score += 1000;
      if (tRaw.includes(qRaw)) score += 500;

      const qNo = removeVietnameseTones(qRaw);
      const tNo = removeVietnameseTones(tRaw);
      const targetWordsNo = tNo.split(/\s+/);

      if (tNo === qNo) score += 4000;
      if (tNo.startsWith(qNo)) score += 1200;
      if (targetWordsNo.includes(qNo)) score += 900;
      if (targetWordsNo.some(w => w.startsWith(qNo))) score += 600;
      if (tNo.includes(qNo)) score += 80;

      return score;
    }

    function updateLiveClock() {
      const now = new Date();
      const daysOfWeek = ['Chủ Nhật', 'Thứ Hai', 'Thứ Ba', 'Thứ Tư', 'Thứ Năm', 'Thứ Sáu', 'Thứ Bảy'];
      const dayName = daysOfWeek[now.getDay()];
      const d = String(now.getDate()).padStart(2, '0');
      const m = String(now.getMonth() + 1).padStart(2, '0');
      const y = now.getFullYear();

      const hh = String(now.getHours()).padStart(2, '0');
      const mm = String(now.getMinutes()).padStart(2, '0');
      const ss = String(now.getSeconds()).padStart(2, '0');

      const calEl = document.getElementById('liveCalendarDisplay');
      const timeEl = document.getElementById('liveTimeDisplay');

      if (calEl) calEl.textContent = `${dayName}, ${d}/${m}/${y} •`;
      if (timeEl) timeEl.textContent = `${hh}:${mm}:${ss}`;
    }

    setInterval(updateLiveClock, 1000);
    updateLiveClock();

    function toggleTimeDisplay() {
      showCardTime = !showCardTime;
      localStorage.setItem('TKB_SHOW_TIME', showCardTime);
      updateTimeDisplayState();
    }

    function updateTimeDisplayState() {
      const lbl = document.getElementById('timeToggleLabel');
      if (showCardTime) {
        if (lbl) {
          lbl.textContent = 'Bật';
          lbl.className = 'font-bold text-blue-600 dark:text-blue-400';
        }
        document.body.classList.remove('hide-card-time');
      } else {
        if (lbl) {
          lbl.textContent = 'Tắt';
          lbl.className = 'font-bold opacity-40';
        }
        document.body.classList.add('hide-card-time');
      }
    }

    function updateIndicator(indicatorId, buttonId) {
      const ind = document.getElementById(indicatorId);
      const btn = document.getElementById(buttonId);
      if (ind && btn) {
        ind.style.transform = `translateX(${btn.offsetLeft}px)`;
        ind.style.width = `${btn.offsetWidth}px`;
        ind.style.height = `${btn.offsetHeight}px`;
        ind.style.top = `${btn.offsetTop}px`;
      }
    }

    function animatedRender(fn) {
      if (document.startViewTransition) {
        document.startViewTransition(() => {
          fn();
        });
      } else {
        fn();
      }
    }

    function setDay(day, index) {
      selectedDay = day;
      selectedDayIndex = index;
      updateIndicator('dayIndicator', 'btnDay' + index);
      animatedRender(render);
    }

    function setSession(session, index) {
      selectedSession = session;
      selectedSessionIndex = index;
      updateIndicator('sessionIndicator', 'btnSession' + index);

      document.body.classList.remove('theme-sang', 'theme-chieu', 'theme-ca2');
      const bgSang = document.getElementById('bgSang');
      const bgChieu = document.getElementById('bgChieu');
      const bgCa2 = document.getElementById('bgCa2');

      if (session === 'Sáng') {
        document.body.classList.add('theme-sang');
        bgSang.style.opacity = '1';
        bgChieu.style.opacity = '0';
        bgCa2.style.opacity = '0';
      } else if (session === 'Chiều') {
        document.body.classList.add('theme-chieu');
        bgSang.style.opacity = '0';
        bgChieu.style.opacity = '1';
        bgCa2.style.opacity = '0';
      } else {
        document.body.classList.add('theme-ca2');
        bgSang.style.opacity = '0';
        bgChieu.style.opacity = '0';
        bgCa2.style.opacity = '1';
      }
      render();
    }

    function setLevel(lvl, index) {
      selectedLevel = lvl;
      selectedLevelIndex = index;
      updateIndicator('levelIndicator', 'btnLevel' + index);
      animatedRender(render);
    }

    function setSubject(label) {
      selectedSubject = label;
      renderSubjectBadges();
      animatedRender(render);
    }

    function togglePeriodCollapse(pid, e) {
      if (e) e.stopPropagation();
      const banner = document.getElementById('period-banner-' + pid);
      const wrapper = document.getElementById('period-acc-wrapper-' + pid);
      if (!wrapper) return;

      if (collapsedPeriods.has(pid)) {
        collapsedPeriods.delete(pid);
        wrapper.classList.remove('is-collapsed');
        if (banner) banner.classList.remove('is-collapsed');
      } else {
        collapsedPeriods.add(pid);
        wrapper.classList.add('is-collapsed');
        if (banner) banner.classList.add('is-collapsed');
      }
    }

    function toggleGradeCollapse(gradeKey, e) {
      if (e) e.stopPropagation();
      const btn = document.getElementById('grade-btn-' + gradeKey);
      const wrapper = document.getElementById('grade-acc-wrapper-' + gradeKey);
      if (!wrapper) return;

      if (collapsedGrades.has(gradeKey)) {
        collapsedGrades.delete(gradeKey);
        wrapper.classList.remove('is-collapsed');
        if (btn) btn.classList.remove('is-collapsed');
      } else {
        collapsedGrades.add(gradeKey);
        wrapper.classList.add('is-collapsed');
        if (btn) btn.classList.add('is-collapsed');
      }
    }

    function toggleCollapseAll() {
      isAllCollapsed = !isAllCollapsed;
      const text = document.getElementById('collapseAllText');
      const icon = document.getElementById('collapseAllIcon');

      if (isAllCollapsed) {
        text.textContent = 'Mở rộng';
        icon.style.transform = 'rotate(-180deg)';
        TIMELINE_CONFIG.forEach(cfg => collapsedPeriods.add(cfg.id));
      } else {
        text.textContent = 'Thu gọn';
        icon.style.transform = 'rotate(0deg)';
        collapsedPeriods.clear();
      }

      TIMELINE_CONFIG.forEach(cfg => {
        const banner = document.getElementById('period-banner-' + cfg.id);
        const wrapper = document.getElementById('period-acc-wrapper-' + cfg.id);
        if (wrapper) {
          if (isAllCollapsed) {
            wrapper.classList.add('is-collapsed');
            if (banner) banner.classList.add('is-collapsed');
          } else {
            wrapper.classList.remove('is-collapsed');
            if (banner) banner.classList.remove('is-collapsed');
          }
        }
      });
    }

    function toggleFabMenu() {
      const btn = document.getElementById('fabMainBtn');
      const palette = document.getElementById('fabPalette');
      btn.classList.toggle('is-opened');
      palette.classList.toggle('is-closed');
    }

    function selectPeriodFilter(pid) {
      selectedPeriodFilterValue = pid;
      document.querySelectorAll('.fab-pill-btn').forEach(btn => btn.classList.remove('is-active'));
      const activeBtn = document.getElementById('fabPeriod_' + pid);
      if (activeBtn) activeBtn.classList.add('is-active');

      if (pid !== 'all' && selectedSession !== 'all') {
        const foundPeriod = TIMELINE_CONFIG.find(p => p.id === pid);
        if (foundPeriod) {
          if (foundPeriod.session === 'Sáng' && selectedSession !== 'Sáng') {
            setSession('Sáng', 0);
          } else if (foundPeriod.session === 'Chiều' && selectedSession !== 'Chiều') {
            setSession('Chiều', 1);
          }
        }
      }

      toggleFabMenu();
      animatedRender(render);
    }

    function togglePinTeacher(name, e) {
      if (e) e.stopPropagation();
      if (pinnedTeachers.includes(name)) {
        pinnedTeachers = pinnedTeachers.filter(t => t !== name);
      } else {
        pinnedTeachers.push(name);
      }
      localStorage.setItem('TKB_PINNED', JSON.stringify(pinnedTeachers));
      renderPinnedBar();
      animatedRender(render);
    }

    function renderPinnedBar() {
      const bar = document.getElementById('pinnedBar');
      const list = document.getElementById('pinnedList');
      list.innerHTML = '';
      if (pinnedTeachers.length === 0) {
        bar.classList.add('hidden');
        return;
      }
      bar.classList.remove('hidden');
      pinnedTeachers.forEach(name => {
        const chip = document.createElement('div');
        chip.className = "flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-bold bg-amber-500/20 border border-amber-500/40 text-amber-700 dark:text-amber-300 shadow-sm shrink-0";
        chip.innerHTML = `
          <span class="cursor-pointer" onclick="applySearch('${name}')">${name}</span>
          <button onclick="togglePinTeacher('${name}', event)" class="opacity-60 hover:opacity-100 p-0.5">
            <svg class="w-3 h-3" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </button>
        `;
        list.appendChild(chip);
      });
    }

    function saveHistory(keyword) {
      const k = keyword.trim();
      if (!k) return;
      searchHistory = [k, ...searchHistory.filter(x => x.toLowerCase() !== k.toLowerCase())].slice(0, 8);
      localStorage.setItem('TKB_HISTORY', JSON.stringify(searchHistory));
    }

    function clearHistory() {
      searchHistory = [];
      localStorage.removeItem('TKB_HISTORY');
      renderSuggestBox();
    }

    function applySearch(val) {
      document.getElementById('searchInput').value = val;
      saveHistory(val);
      closeSuggestBox();
      animatedRender(render);
    }

    function clearSearch() {
      document.getElementById('searchInput').value = '';
      document.getElementById('clearSearchBtn').classList.add('hidden');
      closeSuggestBox();
      animatedRender(render);
    }

    function openSuggestBox() {
      renderSuggestBox();
      document.getElementById('suggestBox').classList.remove('hidden');
    }

    function closeSuggestBox() {
      document.getElementById('suggestBox').classList.add('hidden');
    }

    function renderSuggestBox() {
      const query = document.getElementById('searchInput').value.trim();
      const historySection = document.getElementById('historySection');
      const historyList = document.getElementById('historyList');
      const suggestList = document.getElementById('suggestList');

      if (searchHistory.length > 0 && !query) {
        historySection.classList.remove('hidden');
        historyList.innerHTML = '';
        searchHistory.forEach(item => {
          const chip = document.createElement('button');
          chip.className = "px-2.5 py-1 rounded-lg text-[11px] font-medium bg-black/5 dark:bg-white/10 hover:bg-blue-600 hover:text-white transition-all";
          chip.textContent = item;
          chip.onclick = () => applySearch(item);
          historyList.appendChild(chip);
        });
      } else {
        historySection.classList.add('hidden');
      }

      suggestList.innerHTML = '';

      const scoredTeachers = TEACHER_LIST.map(t => ({
        type: 'Giáo viên',
        val: t,
        score: calculateMatchScore(query, t)
      })).filter(x => x.score > 0);

      const scoredSubjects = SUBJECT_LIST.map(s => ({
        type: 'Môn học',
        val: s,
        score: calculateMatchScore(query, s)
      })).filter(x => x.score > 0);

      const scoredClasses = CLASS_LIST.map(c => ({
        type: 'Lớp học',
        val: c,
        score: calculateMatchScore(query, c)
      })).filter(x => x.score > 0);

      const items = [...scoredTeachers, ...scoredSubjects, ...scoredClasses]
        .sort((a, b) => b.score - a.score)
        .slice(0, 7);

      if (items.length === 0) {
        suggestList.innerHTML = '<div class="px-3 py-2 text-xs opacity-50">Không có gợi ý trùng khớp</div>';
      } else {
        items.forEach(it => {
          const row = document.createElement('div');
          row.className = "flex items-center justify-between px-3 py-2 rounded-xl text-xs sm:text-sm hover:bg-blue-600 hover:text-white cursor-pointer transition-colors group";
          row.innerHTML = `
            <span class="font-bold text-truncate-safe">${it.val}</span>
            <span class="text-[10px] sm:text-xs opacity-60 group-hover:opacity-100 shrink-0 ml-2">${it.type}</span>
          `;
          row.onclick = () => applySearch(it.val);
          suggestList.appendChild(row);
        });
      }
    }

    function renderSubjectBadges() {
      const container = document.getElementById('subjectFilterContainer');
      container.innerHTML = '';
      SUBJECT_GROUPS.forEach(g => {
        const isSelected = selectedSubject === g.label;
        const btn = document.createElement('button');
        btn.onclick = () => setSubject(g.label);
        btn.className = `whitespace-nowrap px-3 sm:px-3.5 py-1.5 rounded-full text-[11px] sm:text-xs font-bold transition-all transform active:scale-95 ${
          isSelected 
            ? 'bg-blue-600 text-white shadow-md shadow-blue-500/35' 
            : 'bg-black/5 dark:bg-white/10 opacity-70 hover:opacity-100 hover:bg-black/10'
        }`;
        btn.textContent = g.label;
        container.appendChild(btn);
      });
    }

    function getSubjectDesign(sub) {
      const s = removeVietnameseTones(sub);
      if (s.includes('toan')) return {
        badge: 'bg-blue-500/15 border-blue-500/40 text-blue-600 dark:text-blue-400',
        glow: 'rgba(59, 130, 246, 0.08)'
      };
      if (s.includes('van')) return {
        badge: 'bg-emerald-500/15 border-emerald-500/40 text-emerald-600 dark:text-emerald-400',
        glow: 'rgba(16, 185, 129, 0.08)'
      };
      if (s.includes('anh') || s.includes('tann') || s.includes('speaking') || s.includes('trung')) return {
        badge: 'bg-purple-500/15 border-purple-500/40 text-purple-600 dark:text-purple-400',
        glow: 'rgba(168, 85, 247, 0.08)'
      };
      if (s.includes('khtn') || s.includes('ly') || s.includes('hoa') || s.includes('sinh')) return {
        badge: 'bg-cyan-500/15 border-cyan-500/40 text-cyan-600 dark:text-cyan-400',
        glow: 'rgba(6, 182, 212, 0.08)'
      };
      if (s.includes('su') || s.includes('dia') || s.includes('gdcd') || s.includes('ktpl')) return {
        badge: 'bg-amber-500/15 border-amber-500/40 text-amber-600 dark:text-amber-400',
        glow: 'rgba(245, 158, 11, 0.08)'
      };
      if (s.includes('tin') || s.includes('stem') || s.includes('cong nghe')) return {
        badge: 'bg-indigo-500/15 border-indigo-500/40 text-indigo-600 dark:text-indigo-400',
        glow: 'rgba(99, 102, 241, 0.08)'
      };
      if (s.includes('hdtn') || s.includes('ky nang') || s.includes('huong nghiep')) return {
        badge: 'bg-rose-500/15 border-rose-500/40 text-rose-600 dark:text-rose-400',
        glow: 'rgba(244, 63, 94, 0.08)'
      };
      if (s.includes('gdtc')) return {
        badge: 'bg-orange-500/15 border-orange-500/40 text-orange-600 dark:text-orange-400',
        glow: 'rgba(249, 115, 22, 0.08)'
      };
      if (s.includes('am nhac') || s.includes('my thuat')) return {
        badge: 'bg-fuchsia-500/15 border-fuchsia-500/40 text-fuchsia-600 dark:text-fuchsia-400',
        glow: 'rgba(217, 70, 239, 0.08)'
      };
      return {
        badge: 'bg-teal-500/15 border-teal-500/40 text-teal-600 dark:text-teal-400',
        glow: 'rgba(20, 184, 166, 0.08)'
      };
    }

    function getPinSvg(isPinned) {
      if (isPinned) {
        return `<svg class="w-3.5 h-3.5 fill-amber-500 text-amber-500" viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>`;
      }
      return `<svg class="w-3.5 h-3.5 opacity-30 hover:opacity-100 transition-opacity" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>`;
    }

    function render() {
      const rawInput = document.getElementById('searchInput').value;
      const query = rawInput.trim();
      const groupObj = SUBJECT_GROUPS.find(g => g.label === selectedSubject);

      const clearBtn = document.getElementById('clearSearchBtn');
      if (rawInput.length > 0) {
        clearBtn.classList.remove('hidden');
      } else {
        clearBtn.classList.add('hidden');
      }

      let matchedItems = RAW_DATA.filter(item => {
        if (item.day !== selectedDay) return false;
        if (selectedSession !== 'all' && item.session !== selectedSession) return false;
        if (item.level !== selectedLevel) return false;

        if (selectedPeriodFilterValue !== 'all' && item.period !== selectedPeriodFilterValue) return false;

        if (groupObj && groupObj.id !== 'all') {
          const normSubject = removeVietnameseTones(item.subject);
          const matched = groupObj.keywords.some(k => normSubject.includes(k));
          if (!matched) return false;
        }

        if (query) {
          const scoreTeacher = calculateMatchScore(query, item.teacher);
          const scoreClass = calculateMatchScore(query, item.class);
          const scoreSubject = calculateMatchScore(query, item.subject);
          const maxScore = Math.max(scoreTeacher, scoreClass, scoreSubject);
          if (maxScore <= 0) return false;
          item._searchScore = maxScore;
        } else {
          item._searchScore = 0;
        }

        return true;
      });

      const countEl = document.getElementById('filteredCount');
      if (countEl) countEl.textContent = matchedItems.length;

      const timelineContainer = document.getElementById('timelineContainer');
      const emptyState = document.getElementById('emptyState');

      if (matchedItems.length === 0) {
        emptyState.classList.remove('hidden');
        timelineContainer.innerHTML = '';
        return;
      }
      emptyState.classList.add('hidden');

      let fullHtml = '';

      TIMELINE_CONFIG.forEach(periodCfg => {
        if (selectedSession !== 'all' && periodCfg.session !== selectedSession) return;
        if (selectedPeriodFilterValue !== 'all' && periodCfg.id !== selectedPeriodFilterValue) return;

        const itemsInPeriod = matchedItems.filter(it => it.period === periodCfg.id);
        if (itemsInPeriod.length === 0) return;

        itemsInPeriod.sort((a, b) => {
          const aPinned = pinnedTeachers.includes(a.teacher);
          const bPinned = pinnedTeachers.includes(b.teacher);
          if (aPinned && !bPinned) return -1;
          if (!aPinned && bPinned) return 1;

          if (query && (b._searchScore !== a._searchScore)) {
            return b._searchScore - a._searchScore;
          }

          return a.class.localeCompare(b.class, undefined, { numeric: true });
        });

        const isMorn = periodCfg.session === 'Sáng';
        const bannerClass = isMorn ? 'period-banner-sang' : 'period-banner-chieu';
        const pillGradient = isMorn 
          ? 'bg-amber-500 text-white shadow-sm' 
          : 'bg-blue-600 text-white shadow-sm';

        const isPeriodCollapsed = collapsedPeriods.has(periodCfg.id);
        const periodAccClass = isPeriodCollapsed ? 'is-collapsed' : '';
        const bannerCollapsedClass = isPeriodCollapsed ? 'is-collapsed' : '';

        let gradeBoxesHtml = '';

        GRADE_ORDER.forEach(gName => {
          const itemsInGrade = itemsInPeriod.filter(it => it.grade === gName);
          if (itemsInGrade.length === 0) return;

          const gradeKey = periodCfg.id + '_' + gName.replace(/\s+/g, '');
          const isGradeCollapsed = collapsedGrades.has(gradeKey);
          const gradeAccClass = isGradeCollapsed ? 'is-collapsed' : '';
          const gradeBtnCollapsedClass = isGradeCollapsed ? 'is-collapsed' : '';

          let cardsHtml = '';
          for (let idx = 0; idx < itemsInGrade.length; idx++) {
            const item = itemsInGrade[idx];
            const design = getSubjectDesign(item.subject);
            const isPinned = pinnedTeachers.includes(item.teacher);
            const pinClass = isPinned ? 'pinned-card' : '';
            const pinSvg = getPinSvg(isPinned);

            cardsHtml += `
              <div class="item-card rounded-2xl p-3 sm:p-3.5 flex flex-col justify-between active:scale-95 sm:hover:scale-[1.02] sm:hover:-translate-y-0.5 ${pinClass}">
                <div>
                  <div class="flex items-center justify-between gap-1 mb-1.5">
                    <span onclick="applySearch('${item.class}')" class="text-xs sm:text-sm font-extrabold text-blue-600 dark:text-blue-400 tracking-tight cursor-pointer hover:underline" title="Lọc theo lớp ${item.class}">
                      ${item.class || 'Toàn trường'}
                    </span>
                    <span onclick="applySearch('${item.subject}')" class="text-[9.5px] sm:text-[10px] font-extrabold px-2 py-0.5 rounded-lg border text-truncate-safe max-w-[90px] sm:max-w-[100px] cursor-pointer hover:opacity-80 transition-opacity ${design.badge}" title="Lọc theo môn ${item.subject}">
                      ${item.subject}
                    </span>
                  </div>
                  
                  <div class="flex items-center justify-between gap-1 pt-0.5">
                    <h3 class="teacher-name-title font-bold opacity-95 cursor-pointer hover:text-blue-600 transition-colors flex-1" onclick="applySearch('${item.teacher}')" title="${item.teacher}">
                      ${item.teacher}
                    </h3>
                    <button onclick="togglePinTeacher('${item.teacher}', event)" title="Ghim giáo viên này" class="pin-btn-row2 shrink-0 p-0.5 rounded hover:bg-black/5 dark:hover:bg-white/10 transition-colors">
                      ${pinSvg}
                    </button>
                  </div>
                </div>

                <div class="time-slot-wrapper mt-2 pt-1.5 border-t border-black/5 dark:border-white/10 flex items-center justify-between text-[10px] sm:text-[10.5px] font-bold">
                  <div class="flex items-center gap-1.5">
                    <svg class="w-3 h-3 shrink-0" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                    <span class="card-time-val">${periodCfg.time}</span>
                  </div>
                  <button onclick="togglePinTeacher('${item.teacher}', event)" title="Ghim giáo viên này" class="pin-btn-footer p-0.5 rounded hover:bg-black/5 dark:hover:bg-white/10 transition-colors">
                    ${pinSvg}
                  </button>
                </div>
              </div>
            `;
          }

          gradeBoxesHtml += `
            <div class="grade-box p-3.5 sm:p-4 space-y-2.5">
              <div onclick="toggleGradeCollapse('${gradeKey}', event)" id="grade-btn-${gradeKey}" class="grade-header-btn flex items-center justify-between cursor-pointer select-none ${gradeBtnCollapsedClass}">
                <div class="flex items-center gap-2">
                  <span class="px-3 py-1 rounded-xl text-xs font-black bg-blue-600/15 border border-blue-500/30 text-blue-700 dark:text-blue-300">
                    ${gName}
                  </span>
                  <span class="text-xs font-bold opacity-50">${itemsInGrade.length} lớp</span>
                </div>
                <svg class="w-4 h-4 opacity-50 grade-chevron" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>
              </div>
              <div id="grade-acc-wrapper-${gradeKey}" class="grade-accordion-wrapper ${gradeAccClass}">
                <div class="grade-accordion-inner pt-1">
                  <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-2.5 sm:gap-3">
                    ${cardsHtml}
                  </div>
                </div>
              </div>
            </div>
          `;
        });

        fullHtml += `
          <div id="period-section-${periodCfg.id}" class="period-block space-y-3.5">
            <div onclick="togglePeriodCollapse('${periodCfg.id}', event)" id="period-banner-${periodCfg.id}" class="period-banner ${bannerClass} ${bannerCollapsedClass} px-4 sm:px-5 py-3 flex items-center justify-between gap-3 shadow-md font-semibold">
              <div class="flex items-center gap-3">
                <div class="px-3.5 py-1.5 rounded-xl text-xs sm:text-sm font-black ${pillGradient} tracking-wider flex items-center gap-1.5 shrink-0">
                  <span>${periodCfg.name.toUpperCase()}</span>
                </div>
                <div class="period-time-container flex items-center gap-1.5 text-xs sm:text-sm font-extrabold tracking-wide px-2.5 py-1 rounded-full shrink-0">
                  <svg class="w-3.5 h-3.5 sm:w-4 sm:h-4 shrink-0" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                  <span>${periodCfg.time}</span>
                </div>
              </div>
              <div class="flex items-center gap-3">
                <span class="period-count-badge text-xs sm:text-sm font-black px-3.5 py-1 rounded-full shrink-0">
                  Tổng: ${itemsInPeriod.length} lớp
                </span>
                <svg class="w-5 h-5 opacity-60 chevron-icon shrink-0" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>
              </div>
            </div>
            
            <div id="period-acc-wrapper-${periodCfg.id}" class="period-accordion-wrapper ${periodAccClass}">
              <div class="period-accordion-inner space-y-3">
                ${gradeBoxesHtml}
              </div>
            </div>
          </div>
        `;
      });

      timelineContainer.innerHTML = fullHtml;
    }

    const searchInputEl = document.getElementById('searchInput');

    searchInputEl.addEventListener('focus', openSuggestBox);
    searchInputEl.addEventListener('input', () => {
      renderSuggestBox();
      render();
    });

    searchInputEl.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        saveHistory(searchInputEl.value);
        closeSuggestBox();
        render();
      }
    });

    document.addEventListener('click', (e) => {
      if (!e.target.closest('#searchWrapper') && !e.target.closest('#suggestBox')) {
        closeSuggestBox();
      }
      if (!e.target.closest('.fab-container')) {
        const btn = document.getElementById('fabMainBtn');
        const palette = document.getElementById('fabPalette');
        if (btn && palette && btn.classList.contains('is-opened')) {
          btn.classList.remove('is-opened');
          palette.classList.add('is-closed');
        }
      }
    });

    async function loadDatabase() {
      if (window.RAW_DATA && window.RAW_DATA.length > 0) {
        RAW_DATA = window.RAW_DATA;
      } else {
        try {
          const response = await fetch('data.json');
          if (response.ok) {
            RAW_DATA = await response.json();
          }
        } catch (err) {
          console.error(err);
        }
      }

      initDataStructures();
      renderPinnedBar();
      renderSubjectBadges();
      updateIndicator('levelIndicator', 'btnLevel' + selectedLevelIndex);
      updateIndicator('dayIndicator', 'btnDay' + selectedDayIndex);
      updateIndicator('sessionIndicator', 'btnSession' + selectedSessionIndex);
      render();
    }

    window.addEventListener('load', () => {
      updateTimeDisplayState();
      loadDatabase();
    });

    window.addEventListener('resize', () => {
      updateIndicator('levelIndicator', 'btnLevel' + selectedLevelIndex);
      updateIndicator('dayIndicator', 'btnDay' + selectedDayIndex);
      updateIndicator('sessionIndicator', 'btnSession' + selectedSessionIndex);
    });
  </script>
</body>
</html>
